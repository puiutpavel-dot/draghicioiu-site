<html lang="ro">
<head>
<meta charset="utf-8">

<title>Rețete de familie · draghicioiu.ro</title>
<meta name="description" content="Rețete de familie scrise de mână: Prăjitura Crèm Olé, Cornulețe fragede și Pavlova ruladă.">
<link rel="canonical" href="https://draghicioiu.ro/retete/">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='18'%3E%F0%9F%8D%B0%3C/text%3E%3C/svg%3E">

<style>
:root{
  --bg:#fbf5ec; --card:#fffdf9; --ink:#2b2118; --muted:#86725f; --line:#eadfce;
  --accent:#b5485d; --accent-soft:#f6dfe3; --gold:#d39b3a; --ok:#4f8a5b; --ok-soft:#e1efe2;
  --shadow:0 10px 30px -12px rgba(80,50,20,.25);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1613; --card:#251f1a; --ink:#f3e8da; --muted:#b39f8a; --line:#3a3029;
    --accent:#e07a8e; --accent-soft:#3d2429; --gold:#e5b25c; --ok:#7cc08a; --ok-soft:#22332500;
    --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1613; --card:#251f1a; --ink:#f3e8da; --muted:#b39f8a; --line:#3a3029;
  --accent:#e07a8e; --accent-soft:#3d2429; --gold:#e5b25c; --ok:#7cc08a; --ok-soft:#223325;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fraunces",Georgia,serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 80px}

.back{display:inline-block;margin:16px 16px 0;color:var(--muted);text-decoration:none;font-size:14px}
.back:hover{color:var(--accent)}
/* HERO */
.hero{position:relative;text-align:center;padding:56px 0 34px;overflow:hidden}
.hero h1{font-family:"Caveat",cursive;font-weight:700;font-size:clamp(46px,9vw,78px);margin:0;line-height:1;color:var(--accent)}
.hero p{margin:10px 0 0;color:var(--muted);font-size:17px}
.floaty{position:absolute;inset:0;pointer-events:none;z-index:-0}
.floaty span{position:absolute;font-size:26px;opacity:.55;animation:drift 9s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-16px) rotate(10deg)}}
.hero h1,.hero p{position:relative;z-index:1}

/* TABS */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin-bottom:18px}
.tabbar{position:relative;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;flex:1 0 auto;border:0;background:none;color:var(--muted);font:600 15px "Fraunces",serif;padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .3s}
.tab[aria-selected="true"]{color:#fff}
.pill{position:absolute;top:5px;bottom:5px;left:0;border-radius:999px;background:var(--accent);transition:transform .45s cubic-bezier(.6,.0,.2,1.3),width .45s cubic-bezier(.6,0,.2,1.3)}

/* RECIPE */
.recipe{animation:fadeup .55s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rhead{text-align:center;margin:6px 0 22px}
.rhead h2{font-family:"Caveat",cursive;font-size:clamp(40px,7vw,56px);margin:0;line-height:1.05}
.rhead .note{display:inline-block;margin-top:6px;font-family:"Caveat",cursive;font-size:24px;color:var(--accent);transform:rotate(-3deg)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.chip b{color:var(--ink)}

.section{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.shead h3{margin:0;font-family:"Caveat",cursive;font-size:34px;line-height:1;color:var(--accent)}
.bowl{position:relative;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);white-space:nowrap}
.bowl .b{font-size:30px;display:inline-block;transition:transform .2s}
.bowl.bump .b{animation:bump .45s ease}
@keyframes bump{30%{transform:scale(1.35) rotate(-10deg)}60%{transform:scale(.9) rotate(6deg)}}
.bowl.full .count{color:var(--ok);font-weight:700}
.reset{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:0}

.ings{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ing{opacity:0;animation:pop .55s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:calc(var(--i)*75ms + 120ms)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.85)}to{opacity:1;transform:none}}
.ing button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .25s,background .25s,transform .15s}
.ing button:hover{border-color:var(--gold);transform:translateY(-2px)}
.ing button:active{transform:scale(.97)}
.emo{flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:26px;background:var(--card);border-radius:12px;transition:transform .3s}
.ing button:hover .emo{animation:wobble .6s ease}
@keyframes wobble{25%{transform:rotate(-14deg) scale(1.1)}50%{transform:rotate(10deg)}75%{transform:rotate(-5deg)}}
.txt{flex:1;min-width:0}
.q{display:block;font-weight:700;font-size:15px;color:var(--accent)}
.n{font-size:15px;background:linear-gradient(var(--muted),var(--muted)) no-repeat 0 55%/0% 1.5px;transition:background-size .45s ease,color .3s}
.alt{display:block;font-size:12.5px;color:var(--muted);font-style:italic}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:all .3s}
.tick svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s .1s}
.ing.done button{background:var(--ok-soft);border-color:var(--ok)}
.ing.done .n{background-size:100% 1.5px;color:var(--muted)}
.ing.done .q{color:var(--muted)}
.ing.done .emo{opacity:.35;transform:scale(.8)}
.ing.done .tick{background:var(--ok);border-color:var(--ok)}
.ing.done .tick svg{stroke-dashoffset:0}

.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:4px 0 14px 46px;opacity:0;transform:translateX(-12px);transition:opacity .5s,transform .5s}
.steps li.in{opacity:1;transform:none}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:15px}
.steps li::after{content:"";position:absolute;left:15px;top:38px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.method-label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 0 12px}

/* LIDL */
.lidl{display:block;margin-top:3px;font-size:12px;line-height:1.35;color:var(--muted)}
.lidl b{color:var(--ink);font-weight:600;white-space:nowrap}
.lidl.miss{font-style:italic}
.lidl .sub{color:var(--gold);font-weight:600}
.cart{max-width:520px;margin:16px auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);text-align:left}
.cart h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.cart .rows{display:flex;flex-wrap:wrap;gap:8px 18px}
.cart .big{font-size:24px;font-weight:700;color:var(--accent);line-height:1.1}
.cart .lbl{font-size:12.5px;color:var(--muted)}
.cart details{margin-top:10px;font-size:13px}
.cart summary{cursor:pointer;color:var(--muted)}
.cart ul{margin:8px 0 0;padding:0;list-style:none}
.cart li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px dashed var(--line)}
.cart li span:last-child{white-space:nowrap;font-weight:600}
.cart .fine{margin:10px 0 0;font-size:12px;color:var(--muted)}

/* ICONS */
:root{--ic:#3b2a1e}
.ico{width:34px;height:34px;display:block}
.ico *{stroke:var(--ic);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.ico path:not([fill]),.ico rect:not([fill]){fill:none}
.ico .hl{stroke:#fff;stroke-width:2.2;opacity:.85}
.ico .hl2{stroke:#e6ddd0;stroke-width:1.6}
.ico .dot{fill:var(--ic);stroke:none}
.ico .wdot{fill:#fff;stroke:none}
.flyer .ico{width:30px;height:30px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .emo{background:#efe4d3}}
:root[data-theme="dark"] .emo{background:#efe4d3}

/* OFERTE LIDL CU POZĂ */
.deal{max-width:520px;margin:12px auto 0;display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:left;color:inherit;text-decoration:none;transition:transform .2s,border-color .2s}
.deal:hover{transform:translateY(-2px);border-color:var(--gold)}
.deal img{flex:none;width:104px;height:104px;object-fit:cover;object-position:center;transform:none;background:#fff;border-radius:12px}
.deal .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px;white-space:nowrap}
.deal .nm{display:block;font-weight:600;font-size:15px;margin:4px 0 2px;line-height:1.3}
.deal .pr{font-size:13px;color:var(--muted)}
.deal .pr b{color:var(--accent);font-size:16px}
.deal .for{display:block;font-size:12.5px;color:var(--muted);font-style:italic;margin-top:2px}

.flyer{position:fixed;z-index:50;font-size:26px;pointer-events:none;will-change:transform}
footer{text-align:center;color:var(--muted);font-family:"Caveat",cursive;font-size:22px;margin-top:30px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ing,.steps li{opacity:1;transform:none}
}
</style>
</head>

rect x=\"17\" y=\"24\" width=\"14\" height=\"9\" rx=\"2\" fill=\"#fffaf0\"/><path class=\"hl\" d=\"M16 21v5\"/>", "faina": "<path d=\"M14 15q10-4 20 0l3 23q-13 4-26 0z\" fill=\"#f4ecdf\"/><path d=\"M17 15q7 4 14 0\"/><path d=\"M24 22v12\"/><path d=\"M24 25l-3-2M24 29l-3-2M24 25l3-2M24 29l3-2\"/>", "unt": "<path d=\"M8 24l9-8h23l-9 8z\" fill=\"#fde39a\"/><path d=\"M8 24h23v11H8z\" fill=\"#f6cf5f\"/><path d=\"M31 24l9-8v11l-9 8z\" fill=\"#e5b648\"/><path d=\"M8 30h23\" stroke-dasharray=\"2 3\"/>", "ciocolata": "<rect x=\"13\" y=\"7\" width=\"22\" height=\"30\" rx=\"2\" fill=\"#6b3f26\"/><path d=\"M13 15h22M13 23h22M24 7v18\"/><path d=\"M11 25l26-3v17a2 2 0 0 1-2 2H13a2 2 0 0 1-2-2z\" fill=\"#d9b25a\"/>", "nuca": "<path d=\"M24 12c9 0 13 6 13 13s-5 13-13 13-13-6-13-13 4-13 13-13z\" fill=\"#c99a63\"/><path d=\"M24 12v26\"/><path d=\"M17 19q3 2 0 5t1 6M31 19q-3 2 0 5t-1 6\"/>", "rahat": "<rect x=\"8\" y=\"22\" width=\"15\" height=\"15\" rx=\"3\" fill=\"#f3a7b8\"/><rect x=\"25\" y=\"22\" width=\"15\" height=\"15\" rx=\"3\" fill=\"#f7c2ce\"/><rect x=\"16\" y=\"9\" width=\"15\" height=\"14\" rx=\"3\" fill=\"#f3a7b8\"/><circle class=\"wdot\" cx=\"12\" cy=\"26\" r=\"1.2\"/><circle class=\"wdot\" cx=\"31\" cy=\"27\" r=\"1.2\"/><circle class=\"wdot\" cx=\"22\" cy=\"13\" r=\"1.2\"/><circle class=\"wdot\" cx=\"35\" cy=\"32\" r=\"1.2\"/>", "fructe": "<path d=\"M7 17q-1 14 9 21q9-7 9-21z\" fill=\"#e2453c\"/><path d=\"M7 17l3-5 3 3 3-4 3 4 3-3 3 5z\" fill=\"#5d9b4d\"/><circle class=\"wdot\" cx=\"13\" cy=\"24\" r=\"1\"/><circle class=\"wdot\" cx=\"18\" cy=\"28\" r=\"1\"/><circle class=\"wdot\" cx=\"14\" cy=\"31\" r=\"1\"/><circle cx=\"30\" cy=\"12\" r=\"3.2\" fill=\"#d63f6b\"/><circle cx=\"36\" cy=\"12\" r=\"3.2\" fill=\"#d63f6b\"/><circle cx=\"33\" cy=\"17\" r=\"3.2\" fill=\"#d63f6b\"/><circle cx=\"33\" cy=\"7\" r=\"3\" fill=\"#d63f6b\"/><circle cx=\"33\" cy=\"31\" r=\"7\" fill=\"#4c5fa8\"/><path d=\"M31 27.5l2 1.5 2-1.5\"/>"};
const ico=k=>I[k]?`<svg class="ico" viewBox="0 0 48 48" aria-hidden="true">${I[k]}</svg>`:k;
// Prețuri din lista oficială Lidl România („Prețurile la zi”), descărcată pe 1 noiembrie 2026.
const LIDL_DATE="1 noiembrie 2026";
const L={
 oua:["10 Ouă M Sol","10 buc",10.99,10],
 sare:["Kania Sare de mare iodată","1 kg",1.99,1000],
 zahar:["Furnicuța Zahăr","1 kg",3.99,1000],
 cremaCacao:["Belbake Cremă pt. prăjituri cu gust de ciocolată","55 g",2.49,1,true],
 cremaVanilie:["Belbake Cremă pt. prăjituri cu gust de vanilie","50 g",2.69,1,true],
 praf:["Belbake Praf de copt","5×10 g",1.49,5],
 frisca:["Pilos Smântână pentru frișcă 36%","500 g",14.99,500],
 lapte:["Pilos Lapte de consum 3,5%","1 l",5.29,1000],
 vanilinat:["Belbake Zahăr vanilinat","5×8 g",0.75,5],
 ciocolata:["Ciocolată neagră (marca Lidl)","100 g",5.29,100],
 unt:["Pilos Unt german 82%","250 g",7.99,250],
 faina:["Belbake Făină albă de grâu 000","1 kg",1.99,1000],
 smantana:["Pilos Smântână 20%","400 g",6.09,400],
 gem:["Maribel Gem de căpșuni","450 g",9.99,450],
 nuca:["Belbake Miez de nucă măcinat/tocat","220 g",14.99,220],
 mascarpone:["Milbona Mascarpone","250 g",8.99,250],
 pudra:["Belbake Zahăr pudră","500 g",2.99,500],
 zmeura:["Zmeură","125 g",12.99,125],
 capsuni:["Căpșuni românești","250 g",11.49,250],
 afine:["Afine caserolă","250 g",19.99,250]
};
// [produs, cantitate folosită în unitatea pachetului]; 0 = nu e în lista Lidl; opt = opțional, nu intră în total
const P={
 "crem-ole":[
  [[["oua",8]],[["sare",1]],[["zahar",120]],[["cremaCacao",2]],[["praf",1]]],
  [[["frisca",400]],[["lapte",400]],[["zahar",30]],[["vanilinat",1]],[["cremaVanilie",2]]],
  [[["ciocolata",150]],[["unt",50]],[["zahar",30]],[["frisca",40]]]],
 "cornulete":[
  [[["faina",500]],0,[["smantana",200]],[["vanilinat",1]],[["sare",1]],[["oua",1]]],
  [0,[["gem",200]],{opt:[["nuca",50]]}]],
 "pavlova":[
  [[["oua",7]],[["sare",1]],[["zahar",105]],[["nuca",15]]],
  [[["frisca",200]],[["mascarpone",250]],[["pudra",20]],[["vanilinat",1]],[["sare",1]],[["zmeura",125],["capsuni",250],["afine",250]]]]
};
const lei=x=>x.toFixed(2).replace('.',',')+' lei';
function lidlLine(e){
  if(e===0) return `<span class="lidl miss">🛒 nu e în lista Lidl</span>`;
  const opt=!!(e&&e.opt), arr=opt?e.opt:e;
  return `<span class="lidl">🛒 ${arr.map(([k])=>{const x=L[k];return `${x[4]?'<span class="sub">înlocuitor:</span> ':''}${x[0]} · ${x[1]} · <b>${lei(x[2])}</b>`}).join(' + ')}${opt?' <i>(opțional)</i>':''}</span>`;
}
function cart(id){
  const use={},miss=[];
  P[id].forEach((sec,si)=>sec.forEach((e,ii)=>{
    if(e===0){miss.push(R.find(r=>r.id===id).sections[si].ings[ii][2]);return}
    if(e.opt) return;
    e.forEach(([k,a])=>use[k]=(use[k]||0)+a);
  }));
  let buy=0,used=0;const rows=[];
  for(const k in use){const x=L[k],n=Math.ceil(use[k]/x[3]-1e-9);buy+=n*x[2];used+=use[k]/x[3]*x[2];
    rows.push(`<li><span>${n>1?n+'× ':''}${x[0]} (${x[1]})</span><span>${lei(n*x[2])}</span></li>`)}
  return `<div class="cart"><h4>🛒 Coș Lidl</h4>
    <div class="rows"><div><div class="big">${lei(buy)}</div><div class="lbl">de cumpărat (pachete întregi)</div></div>
    <div><div class="big">~${lei(used)}</div><div class="lbl">cât se folosește în rețetă</div></div></div>
    <details><summary>Lista de cumpărături (${rows.length} produse)</summary><ul>${rows.join('')}</ul></details>
    <p class="fine">Prețuri din lista oficială Lidl „Prețurile la zi”, ${LIDL_DATE}. Pot varia între magazine și nu includ ofertele.${miss.length?` Nu sunt în listă, deci nici în total: ${miss.join(', ')}.`:''}</p></div>`;
}

// Produse din oferta lidl.ro care se potrivesc cu rețetele (pozele sunt de pe lidl.ro, 2 noiembrie 2026).
// Fiecare dispare singur de pe pagină după ultima zi a ofertei.
const D={
 "crem-ole":[{img:"img/lidl-unt.webp",name:"DELUXE Unt cu sare de mare din Camargue",pack:"250 g",lp:"7,99",fara:"10,89",from:"5",to:"2026-11-08",toTxt:"8 nov.",for:"pentru glazură (unt)",url:"https://www.lidl.ro/p/deluxe-unt-cu-sare-de-mare-din-camergue/p11030371"}],
 "cornulete":[{img:"img/lidl-smantana.webp",name:"PILOS Cremă de smântână natur",pack:"200 g",lp:"4,99",fara:"6,49",from:"2",to:"2026-11-08",toTxt:"8 nov.",for:"pentru aluat (smântână)",url:"https://www.lidl.ro/p/crema-de-smantana/p11707505"}],
 "pavlova":[{img:"img/lidl-afine.webp",name:"FRESHONA Fructe de pădure congelate",pack:"750 g",lp:"14,29",fara:"15,99",from:"5",to:"2026-11-08",toTxt:"8 nov.",for:"pentru cremă & fructe (zmeură, afine) — se dezgheață și se scurg bine",url:"https://www.lidl.ro/p/freshona-afine-de-cultura-congelate/p11008792"}]
};
function deals(id){
  const now=new Date();
  return (D[id]||[]).filter(d=>now<=new Date(d.to+'T23:59:59')).map(d=>`<a class="deal" href="${d.url}" target="_blank" rel="noopener">
    <img src="${d.img}" alt="${d.name}, ${d.pack}" width="104" height="104">
    <span><span class="tag">Ofertă Lidl · ${d.from}–${d.toTxt}</span>
    <span class="nm">${d.name} · ${d.pack}</span>
    <span class="pr"><b>${d.lp} lei</b> cu Lidl Plus · ${d.fara} lei fără</span>
    <span class="for">${d.for}</span></span></a>`).join('');
}

const bar=document.getElementById('tabbar'), pill=document.getElementById('pill'), panel=document.getElementById('panel');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let io;

R.forEach((r,i)=>{
  const b=document.createElement('button');
  b.className='tab';b.role='tab';b.textContent=r.tab;b.dataset.i=i;
  b.onclick=()=>show(i,true);
  bar.appendChild(b);
});

function movePill(btn){
  pill.style.width=btn.offsetWidth+'px';
  pill.style.transform=`translateX(${btn.offsetLeft}px)`;
}

function show(i,push){
  const r=R[i];
  [...bar.querySelectorAll('.tab')].forEach((t,k)=>t.setAttribute('aria-selected',k===i));
  movePill(bar.querySelectorAll('.tab')[i]);
  if(push) try{history.replaceState(null,'','#'+r.id)}catch(e){}
  let n=0;
  panel.innerHTML=`<article class="recipe">
    <div class="rhead"><h2>${r.title}</h2>${r.note?`<div class="note">${r.note}</div>`:''}
      <div class="chips">${r.chips.map(c=>`<span class="chip">${c[0]} <b>${c[1]}</b></span>`).join('')}</div>${P[r.id]?cart(r.id):''}${deals(r.id)}</div>
    ${r.sections.map((s,si)=>`<section class="section" data-s="${si}">
      <div class="shead"><h3>${s.name}</h3>
        <div class="bowl"><span class="count">0/${s.ings.length}</span><span class="b">🥣</span></div></div>
      <ul class="ings">${s.ings.map((g,gi)=>`<li class="ing" style="--i:${n++}"><button type="button" aria-pressed="false">
        <span class="emo">${ico(g[0])}</span>
        <span class="txt"><span class="q">${g[1]}</span><span class="n">${g[2]}</span>${g[3]?`<span class="alt">(${g[3]})</span>`:''}${P[r.id]?lidlLine(P[r.id][si][gi]):''}</span>
        <span class="tick"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span></button></li>`).join('')}</ul>
      <div class="method-label">Mod de preparare</div>
      <ol class="steps">${s.steps.map(t=>`<li>${t}</li>`).join('')}</ol>
      <button class="reset" type="button">Debifează tot</button>
    </section>`).join('')}
  </article>`;
  panel.querySelectorAll('.section').forEach(sec=>{
    const bowl=sec.querySelector('.bowl');
    const update=()=>{
      const all=sec.querySelectorAll('.ing'),d=sec.querySelectorAll('.ing.done').length;
      bowl.querySelector('.count').textContent=`${d}/${all.length}`;
      bowl.classList.toggle('full',d===all.length);
    };
    sec.querySelectorAll('.ing button').forEach(btn=>btn.onclick=()=>{
      const li=btn.parentElement,on=!li.classList.contains('done');
      li.classList.toggle('done',on);btn.setAttribute('aria-pressed',on);
      if(on) fly(btn.querySelector('.emo'),bowl,update); else update();
    });
    sec.querySelector('.reset').onclick=()=>{sec.querySelectorAll('.ing.done').forEach(l=>{l.classList.remove('done');l.querySelector('button').setAttribute('aria-pressed','false')});update();};
  });
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.2});
  panel.querySelectorAll('.steps li').forEach((li,k)=>{li.style.transitionDelay=(k%6)*70+'ms';io.observe(li)});
}

function fly(src,bowl,done){
  const target=bowl.querySelector('.b');
  if(reduce||!src.animate){done();return;}
  const a=src.getBoundingClientRect(),b=target.getBoundingClientRect();
  const f=document.createElement('span');f.className='flyer';f.innerHTML=src.innerHTML;
  f.style.left=a.left+a.width/2-13+'px';f.style.top=a.top+a.height/2-16+'px';
  document.body.appendChild(f);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
  f.animate([
    {transform:'translate(0,0) scale(1) rotate(0)'},
    {transform:`translate(${dx*.5}px,${dy*.5-90}px) scale(1.3) rotate(180deg)`,offset:.5},
    {transform:`translate(${dx}px,${dy}px) scale(.4) rotate(360deg)`,opacity:.2}
  ],{duration:700,easing:'cubic-bezier(.4,0,.3,1)'}).onfinish=()=>{
    f.remove();bowl.classList.remove('bump');void bowl.offsetWidth;bowl.classList.add('bump');done();
  };
}

const start=Math.max(0,R.findIndex(r=>'#'+r.id===location.hash));
show(start,false);
addEventListener('resize',()=>movePill(bar.querySelector('[aria-selected="true"]')));
document.fonts&&document.fonts.ready.then(()=>movePill(bar.querySelector('[aria-selected="true"]')));
</script>
