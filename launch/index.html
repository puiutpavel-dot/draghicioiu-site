<style>
:root{
  --bg:#f7f6f3; --surface:#ffffff; --ink:#16181d; --muted:#5d6370; --line:#e4e2dc;
  --accent:#2f5bea; --accent-soft:#e8eefe; --ok:#11845b; --ok-soft:#e1f4ec;
  --warn:#a0610a; --warn-soft:#fbf0de; --skip:#8a8f99; --skip-soft:#eeeff1;
  --radius:14px;
  --font: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101216; --surface:#181b21; --ink:#eceef2; --muted:#9aa1ad; --line:#2a2e36;
    --accent:#7d9bff; --accent-soft:#1f2a4a; --ok:#4fd19c; --ok-soft:#14342a;
    --warn:#f0b35a; --warn-soft:#3a2b14; --skip:#80868f; --skip-soft:#24272d;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:920px;margin:0 auto;padding:40px 16px 64px}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:28px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font-size:clamp(26px,4.5vw,38px);line-height:1.1;letter-spacing:-.02em;margin:0 0 10px;font-weight:750}
.sub{color:var(--muted);margin:0;max-width:560px;font-size:16px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0;background:var(--surface)}
.lang button{border:0;background:none;color:var(--muted);font:600 13px var(--font);padding:7px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.progress{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.progress-num{font-size:28px;font-weight:750;letter-spacing:-.02em}
.progress-num small{font-size:15px;color:var(--muted);font-weight:500}
.progress-meta{color:var(--muted);font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;display:flex}
.bar span{display:block;height:100%;transition:width .3s ease}
.bar .b-live{background:var(--ok)} .bar .b-sent{background:var(--accent)} .bar .b-skip{background:var(--skip)}

.waves{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}
.waves button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 8px;font:600 13px var(--font);cursor:pointer;text-align:left;min-width:0}
.waves button .n{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.waves button .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.waves button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.waves button[aria-pressed="true"] .n{color:var(--accent)}
.wave-note{color:var(--muted);font-size:14px;margin:0 0 18px;min-height:20px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filters input,.filters select{font:14px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.filters input{flex:1 1 200px}
.filters select{flex:0 1 auto}
.btn{font:600 14px var(--font);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 13px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.ghost{color:var(--muted)}

.group-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.group-h h2{font-size:17px;margin:0;letter-spacing:-.01em}
.group-h span{color:var(--muted);font-size:13px}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;transition:border-color .15s}
.item[data-status="live"]{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.item[data-status="skip"]{opacity:.55}
.ico{width:40px;height:40px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-weight:700;color:var(--muted)}
.ico img{width:22px;height:22px}
.name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.name a{font-weight:700;text-decoration:none;font-size:16px}
.name a:hover{text-decoration:underline}
.domain{color:var(--muted);font-size:13px}
.desc{margin:4px 0 8px;color:var(--muted);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.free{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.freemium{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.paid{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.status{font:600 13px var(--font);border-radius:999px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.status[data-v="sent"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.status[data-v="live"]{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.status[data-v="skip"]{background:var(--skip-soft);color:var(--skip);border-color:transparent}
.date{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 0}

footer{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:6px}
footer a{color:var(--accent);font-weight:600;text-decoration:none}
footer a:hover{text-decoration:underline}

@media (max-width:640px){
  header{flex-direction:column-reverse}
  .waves{grid-template-columns:repeat(2,minmax(0,1fr))}
  .waves button:first-child{grid-column:1/-1}
  .item{grid-template-columns:36px 1fr;gap:12px}
  .ico{width:36px;height:36px}
  .side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .filters select{flex:1 1 calc(50% - 4px)}
  .group-h{flex-direction:column;gap:2px}
}
</style>
</head>

  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
  const w=$("waves");
  w.innerHTML=[0,1,2,3,4].map(n=>{
    const count=n?D.filter(d=>d[3]===n).length:D.length;
    const label=n?t.waves[n]:t.all;
    const top=n?(t.wave+" "+n+" · "+count):count;
    return '<button data-w="'+n+'" aria-pressed="'+(S.wave===n)+'"><span class="n">'+top+'</span><span class="t">'+label+'</span></button>';
  }).join("");
  $("wave-note").textContent=S.wave?t.waveNotes[S.wave]:t.allNote;
}

function renderProgress(){
  const t=T[S.lang];
  let live=0,sent=0,skip=0;
  D.forEach(d=>{const v=st(d[0]);if(v==="live")live++;else if(v==="sent")sent++;else if(v==="skip")skip++;});
  const done=live+sent;
  $("p-num").innerHTML=done+' <small>'+t.of+'</small>';
  $("p-meta").innerHTML=
    '<span><i class="dot" style="background:var(--ok)"></i>'+live+' '+t.live+'</span>'+
    '<span><i class="dot" style="background:var(--accent)"></i>'+sent+' '+t.sent+'</span>'+
    '<span><i class="dot" style="background:var(--skip)"></i>'+skip+' '+t.skip+'</span>';
  $("b-live").style.width=(live/D.length*100)+"%";
  $("b-sent").style.width=(sent/D.length*100)+"%";
  $("b-skip").style.width=(skip/D.length*100)+"%";
}

function itemHTML(d){
  const t=T[S.lang];
  const [id,name,dom,wave,type,price,cad,ro,en]=d;
  const v=st(id);
  const rec=store.s[id];
  const tags='<span class="tag '+price+'">'+t.prices[price]+'</span><span class="tag">'+t.types[type]+'</span>'+(cad?'<span class="tag">'+t.cad[cad]+'</span>':'');
  const sel='<select class="status" data-id="'+id+'" data-v="'+v+'" aria-label="Status '+name+'">'+
    Object.keys(t.st).map(k=>'<option value="'+k+'"'+(k===v?' selected':'')+'>'+t.st[k]+'</option>').join("")+'</select>';
  const date=(v!=="todo"&&rec&&rec.d)?'<span class="date">'+fmtDate(rec.d)+'</span>':'';
  return '<article class="item" data-status="'+v+'">'+
    '<div class="ico" data-l="'+name[0]+'"><img loading="lazy" alt="" src="https://www.google.com/s2/favicons?domain='+dom+'&sz=64"></div>'+
    '<div><div class="name"><a href="https://'+dom+'" target="_blank" rel="noopener">'+name+'</a><span class="domain">'+dom+'</span></div>'+
    '<p class="desc">'+(S.lang==="ro"?ro:en)+'</p><div class="tags">'+tags+'</div></div>'+
    '<div class="side">'+sel+date+'</div></article>';
}

function renderList(){
  const t=T[S.lang];
  const q=S.q.trim().toLowerCase();
  const rows=D.filter(d=>
    (!S.wave||d[3]===S.wave)&&(!S.type||d[4]===S.type)&&(!S.price||d[5]===S.price)&&
    (!S.status||st(d[0])===S.status)&&
    (!q||(d[1]+" "+d[2]+" "+d[7]+" "+d[8]).toLowerCase().includes(q)));
  if(!rows.length){$("out").innerHTML='<p class="empty">'+t.empty+'</p>';return;}
  let html="";
  [1,2,3,4].forEach(w=>{
    const g=rows.filter(d=>d[3]===w);
    if(!g.length)return;
    if(!S.wave) html+='<div class="group-h"><h2>'+w+'. '+t.waves[w]+'</h2><span>'+t.waveNotes[w]+'</span></div>';
    html+='<div class="list">'+g.map(itemHTML).join("")+'</div>';
  });
  $("out").innerHTML=html;
  $("out").querySelectorAll(".ico img").forEach(img=>img.addEventListener("error",()=>{const p=img.parentNode;p.textContent=p.dataset.l;}));
}

function renderAll(){renderStatic();renderProgress();renderList();}

document.querySelector(".lang").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  S.lang=b.dataset.lang;store.lang=S.lang;save();renderAll();
});
$("waves").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  S.wave=+b.dataset.w;renderStatic();renderList();
});
$("q").addEventListener("input",e=>{S.q=e.target.value;renderList();});
$("f-type").addEventListener("change",e=>{S.type=e.target.value;renderList();});
$("f-price").addEventListener("change",e=>{S.price=e.target.value;renderList();});
$("f-status").addEventListener("change",e=>{S.status=e.target.value;renderList();});
$("out").addEventListener("change",e=>{
  const s=e.target.closest(".status");if(!s)return;
  const id=s.dataset.id,v=s.value;
  if(v==="todo")delete store.s[id];else store.s[id]={v:v,d:Date.now()};
  save();renderProgress();renderList();
});
$("reset").addEventListener("click",()=>{
  if(!confirm(T[S.lang].resetQ))return;
  store.s={};save();renderProgress();renderList();
});
$("export").addEventListener("click",()=>{
  const t=T[S.lang];
  const esc=x=>'"'+String(x).replace(/"/g,'""')+'"';
  const lines=[["#","Platform","URL","Wave","Type","Price","Status","Date"].map(esc).join(",")];
  D.forEach(d=>{
    const r=store.s[d[0]];
    lines.push([d[0],d[1],"https://"+d[2],d[3]+" "+t.waves[d[3]],t.types[d[4]],t.prices[d[5]],t.st[st(d[0])],r&&r.d?new Date(r.d).toISOString().slice(0,10):""].map(esc).join(","));
  });
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="launch-tracker.csv";
  document.body.appendChild(a);a.click();a.remove();
});

renderAll();
})();
</script>
</body>
</html>
