<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borderou DTAC și PTE – rețea gaze | draghicioiu.ro</title>
<meta name="description" content="Borderou și OPIS pentru documentațiile DTAC și PTE de rețea de distribuție gaze naturale: ce există, ce lipsește, export Word și PDF.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://draghicioiu.ro/borderou/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: listă de lucrări în stânga, fișa și borderoul lucrării în dreapta; tabelul preia culorile OPIS-ului tipărit. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --ink:#17222b; --muted:#5a6a77; --line:#d3dbe1;
  --accent:#0f5c75; --accent-ink:#ffffff; --vol:#ddebf7; --head:#e1e5e8;
  --bad:#c62828; --warn:#9a5600; --good:#1c7446; --soft:#eef2f5;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10171c; --surface:#19232a; --ink:#e5ecf1; --muted:#93a3af; --line:#2d3b45;
    --accent:#56b6d3; --accent-ink:#06222b; --vol:#1c3346; --head:#25313a;
    --bad:#ff7070; --warn:#e3a550; --good:#62c592; --soft:#212d35; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171c; --surface:#19232a; --ink:#e5ecf1; --muted:#93a3af; --line:#2d3b45;
  --accent:#56b6d3; --accent-ink:#06222b; --vol:#1c3346; --head:#25313a;
  --bad:#ff7070; --warn:#e3a550; --good:#62c592; --soft:#212d35; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{font-size:22px;letter-spacing:.01em}
.top p{margin:0;color:var(--muted)}
.top .save{margin-left:auto;color:var(--muted);font-size:13px}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;padding:20px;max-width:1500px;margin:0 auto}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr);padding:16px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.side{align-self:start;display:flex;flex-direction:column}
.side h2{font-size:15px;padding:12px 14px 8px}
.list{list-style:none;margin:0;padding:0 6px 6px;display:flex;flex-direction:column;gap:2px}
.list button{width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:4px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.list button:hover{background:var(--soft)}
.list button[aria-current="true"]{background:var(--soft);border-left-color:var(--accent)}
.list .nm{font-weight:600;overflow-wrap:anywhere}
.list .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:3px;border:1px solid var(--line)}
.tag.dtac{color:var(--warn);border-color:currentColor}.tag.pte{color:var(--accent);border-color:currentColor}
.new{display:flex;gap:6px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.back{color:var(--accent);text-decoration:none;font-weight:500}.back:hover{text-decoration:underline}
.backup{padding:10px 12px 12px;border-top:1px solid var(--line)}.backup p{margin:0 0 8px}.backup .row{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.fisa{padding:16px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.fisa .f{display:flex;flex-direction:column;gap:4px;grid-column:span 2}
.fisa .f.w3{grid-column:span 3}.fisa .f.w6{grid-column:span 6}.fisa .f.w1{grid-column:span 1}
@media (max-width:700px){.fisa{grid-template-columns:repeat(2,minmax(0,1fr))}.fisa .f,.fisa .f.w3,.fisa .f.w1{grid-column:span 1}.fisa .f.w6{grid-column:span 2}}
label,.lab{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:54px}
.sum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px}
.chip{display:inline-flex;gap:6px;align-items:baseline;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px}
.chip b{font-variant-numeric:tabular-nums;font-size:15px}
.chip.bad{color:var(--bad);border-color:currentColor}.chip.warn{color:var(--warn);border-color:currentColor}
.chip.good{color:var(--good);border-color:currentColor}.chip.mut{color:var(--muted)}
.sum .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.note{color:var(--muted);font-size:13px;margin:0;padding:0 16px 12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
thead th{background:var(--head);font-weight:600;font-size:12.5px;position:sticky;top:0}
tr.vol td{background:var(--vol);font-weight:600}
td.nr{text-align:center;width:44px;font-variant-numeric:tabular-nums;color:var(--muted)}
td.den{min-width:190px}
thead th:nth-child(2){width:20%}thead th:nth-child(3){width:200px}thead th:nth-child(4){width:100px}thead th:nth-child(5){width:31%}
table{table-layout:fixed;min-width:940px}thead th:nth-child(1){width:48px}
tr[data-st="lipsa"] td.den{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:5px 8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.l[aria-pressed="true"]{background:var(--bad);color:#fff}
td.file{width:110px}
.flags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:6px}
.flags label{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;color:var(--ink);cursor:pointer}
.prev{font-size:12.5px;margin-top:6px;color:var(--muted)}
.prev .r{color:var(--bad);font-weight:600}
.hint{color:var(--muted);font-size:12.5px}
details{padding:12px 16px}
summary{cursor:pointer;font-weight:600}
pre{margin:10px 0 0;font:12.5px/1.5 ui-monospace,Consolas,monospace;overflow-x:auto;color:var(--muted)}
.empty{padding:32px 20px;color:var(--muted);max-width:60ch}
.msg{padding:10px 16px;color:var(--bad);font-size:13px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="/">← draghicioiu.ro</a>
  <h1>Borderou DTAC și PTE</h1>
  <p>Rețea de distribuție gaze naturale</p>
  <span class="save" id="saveState" role="status">Se încarcă…</span>
</header>
<div class="wrap">
  <aside class="panel side">
    <h2>Lucrări</h2>
    <ul class="list" id="list"></ul>
    <div class="new">
      <button class="btn primary" id="newPte" type="button">+ PTE</button>
      <button class="btn primary" id="newDtac" type="button">+ DTAC</button>
    </div>
    <div class="backup" id="backup" hidden></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script src="jszip.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="fonts.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>
