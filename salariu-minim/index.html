  $("zi").innerHTML="<b>Ziua "+z+"</b> din "+ZILE+" · "+NUME_ZI[(z-1)%7];
  $("bani").innerHTML=lei(S.bani)+"<small>lei</small>";
  $("bani").className="bani"+(S.bani<0?" neg":"");
  var h="";for(var i=1;i<=ZILE;i++)h+='<i class="'+(i<z?"f":i===z?"azi":eWeekend(i)?"we":"")+'"></i>';
  $("zile").innerHTML=h;
  [["en",S.en],["mo",S.mo]].forEach(function(p){
    $(p[0]+"N").textContent=p[1];
    var b=$(p[0]+"B");b.style.width=p[1]+"%";b.className=p[1]<=20?"low":p[1]<=45?"mid":"";
  });
}
function bon(){
  var el=$("bon"); el.hidden=S.zi<1&&!S.loc; if(el.hidden) return;
  var r=S.bon.slice(-14),h='<h3>BONUL LUNII</h3><div class="sm">București · salariul minim</div><hr>';
  if(S.bon.length>r.length) h+='<div class="l h"><span>… '+(S.bon.length-r.length)+' rânduri mai sus</span></div>';
  r.forEach(function(x){
    h+=x.h?'<div class="l h"><span>— '+esc(x.h)+' —</span></div>'
          :'<div class="l"><span>'+esc(x.t)+'</span><span class="v'+(x.v>0?" plus":"")+'">'+semn(x.v)+'</span></div>';
  });
  h+='<hr><div class="l t"><span>ÎN PORTOFEL</span><span class="v">'+lei(S.bani)+' lei</span></div>';
  el.innerHTML=h;
}
function ecran(html){
  var c=$("card"); c.innerHTML=html; c.style.animation="none"; void c.offsetWidth; c.style.animation="";
  hud(); bon(); arataRecord();
}
function rezHtml(){
  if(!S.rez) return ""; var r=S.rez; S.rez=null;
  return '<div class="rez">'+esc(r.t)+(r.d?'<span class="d">'+esc(r.d)+'</span>':'')+'</div>';
}
function butoane(lista,gata){
  var h='<div class="opt">';
  lista.forEach(function(o,i){
    var b=o.b||0, blocat=b<0&&!o.must&&S.bani+b<0;
    h+='<button class="o" data-i="'+i+'"'+(blocat?" disabled":"")+'><span><span class="n">'+esc(o.n)+'</span>'+
       (blocat?'<span class="e">Nu-ți ajung banii</span>':o.e?'<span class="e">'+esc(o.e)+'</span>':'')+'</span>'+
       '<span class="p'+(b>0?" plus":b===0?" zero":"")+'">'+(b===0?"gratis":semn(b)+" lei")+'</span></button>';
  });
  h+='</div>';
  setTimeout(function(){
    Array.prototype.forEach.call(document.querySelectorAll("#card .o"),function(el){
      el.addEventListener("click",function(){gata(lista[+el.getAttribute("data-i")])});
    });
  },0);
  return h;
}

/* ---------- ecrane ---------- */
function intro(){
  nou();
  ecran('<h1>Reziști o lună cu <em>salariul minim</em> în București?</h1>'+
    '<ul class="fapte"><li>Primești <b class="mono">2.699 lei</b> în mână. Atât.</li>'+
    '<li>Alegi unde stai, cu ce mergi la muncă și ce mănânci în fiecare zi.</li>'+
    '<li>Dacă energia sau moralul ajung la zero, luna s-a terminat pentru tine.</li></ul>'+
    '<button class="cta" id="start">Ia salariul</button>');
  $("start").addEventListener("click",locuinta);
}
function locuinta(){
  var l=LOCUINTE.map(function(x){return {n:x.n,e:x.e+" Chirie "+lei(x.chirie)+" + utilități "+lei(x.util)+".",b:-(x.chirie+x.util),must:1,ref:x}});
  ecran('<div class="eti">Înainte de ziua 1</div><h2>Unde stai luna asta?</h2><p class="sub">Chiria și utilitățile se plătesc în avans, din salariu.</p>'+
    butoane(l,function(o){
      S.loc=o.ref; S.bani-=o.ref.chirie+o.ref.util; S.ch.chirie+=o.ref.chirie+o.ref.util;
      S.bon.push({t:"Chirie",v:-o.ref.chirie}); S.bon.push({t:"Utilități",v:-o.ref.util});
      transport();
    }));
}
function transport(){
  var l=TRANSPORT.map(function(x){return {n:x.n,e:x.e,b:-x.cost,must:1,ref:x}});
  ecran('<div class="eti">Înainte de ziua 1</div><h2>Cum ajungi la muncă?</h2><p class="sub">Ți-au rămas '+lei(S.bani)+' lei pentru 30 de zile.</p>'+
    butoane(l,function(o){
      S.tr=o.ref; if(o.ref.cost){S.bani-=o.ref.cost;S.ch.transport+=o.ref.cost;S.bon.push({t:"Abonament transport",v:-o.ref.cost});}
      ziNoua();
    }));
}
function ziNoua(){
  S.zi++;
  if(S.zi>ZILE) return final("luna");
  if(S.zi>1) S.bon.push({h:"Ziua "+S.zi});
  var we=eWeekend(S.zi);
  // uzura zilnica
  S.mo=clamp(S.mo+S.loc.mo); S.en=clamp(S.en+S.loc.en);
  if(we){ S.en=clamp(S.en-3); }
  else{
    S.en=clamp(S.en-8+S.tr.en); S.mo=clamp(S.mo-3+S.tr.mo);
    if(S.tr.zi){ S.bani-=S.tr.zi; S.ch.transport+=S.tr.zi; S.bon.push({t:"Bilete transport",v:-S.tr.zi}); }
  }
  if(verifica()) return;
  if(we) weekend(); else masa();
}
function verifica(){
  if(S.en<=0){final("energie");return true}
  if(S.mo<=0){final("moral");return true}
  return false;
}
function weekend(){
  ecran(rezHtml()+'<div class="eti">Zi liberă</div><h2>Ce faci azi?</h2><p class="sub">Nu mergi la muncă. Poți să te odihnești, să ieși sau să mai faci un ban.</p>'+
    butoane(WEEKEND,function(o){
      misca(o,"iesiri"); S.rez={t:o.r,d:delta(o)};
      if(!verifica()) masa();
    }));
}
function masa(){
  var we=eWeekend(S.zi);
  ecran(rezHtml()+'<div class="eti">'+(we?"Zi liberă":"Zi de lucru")+'</div><h2>Ce mănânci azi?</h2><p class="sub">'+
    (we?"Ziua tot trebuie hrănită.":"Opt ore de muncă te costă 8 puncte de energie și 3 de moral.")+'</p>'+
    butoane(MESE,function(o){
      misca(o,"mancare");
      if(verifica()) return;
      if(!we&&Math.random()<0.68){ var e=trageEveniment(); if(e) return eveniment(e); }
      ziNoua();
    }));
}
function trageEveniment(){
  var bune=S.ev.filter(function(i){var e=EVENIMENTE[i];return !e.cond||e.cond(S)});
  if(!bune.length) return null;
  var i=bune[Math.floor(Math.random()*bune.length)];
  S.ev.splice(S.ev.indexOf(i),1);
  return EVENIMENTE[i];
}
function eveniment(e){
  ecran('<div class="eti">Se întâmplă ceva</div><h2>'+esc(e.t)+'</h2><p class="sub">&nbsp;</p>'+
    butoane(e.c,function(o){
      var inainte=S.bani; misca(o,"neprevazute");
      S.rez={t:o.r,d:delta(o)};
      if(inainte>=0&&S.bani<0){ S.mo=clamp(S.mo-8); S.rez.d+=" · ai intrat pe datorie, moral −8"; }
      if(!verifica()) ziNoua();
    }));
}
function final(cum){
  S.gata=true;
  var titlu,text,supravietuit=cum==="luna";
  if(cum==="energie"){titlu="Ai căzut din picioare";text="În ziua "+S.zi+" corpul a zis stop. Prea puțină mâncare, prea multă oboseală. Luna a câștigat."}
  else if(cum==="moral"){titlu="Ai cedat nervos";text="În ziua "+S.zi+" ți-ai făcut bagajul și ai luat trenul spre casă. Orașul ăsta nu iartă."}
  else if(S.bani<0){titlu="Ai ajuns la salariu… pe datorie";text="Ai dus luna până la capăt, dar începi următoarea cu "+lei(-S.bani)+" lei minus."}
  else if(S.bani<250){titlu="La limită";text="Ai ajuns în ziua de salariu cu "+lei(S.bani)+" lei în buzunar. O singură surpriză în plus și nu mai ajungeai."}
  else if(S.bani<700){titlu="Maestru al bugetului";text="Ai terminat luna cu "+lei(S.bani)+" lei puși deoparte. Puțini reușesc asta."}
  else{titlu="Legendă a economiei";text="Ți-au rămas "+lei(S.bani)+" lei. Cum ai făcut asta cu salariul minim rămâne un mister."}
  var scor=supravietuit?Math.round(S.bani+S.en+S.mo):0, rec=citesteRecord(), recordNou=supravietuit&&(rec===null||scor>rec);
  if(recordNou) scrieRecord(scor);
  var c=S.ch, linii=[["Chirie și utilități",-c.chirie],["Mâncare",-c.mancare],["Transport",-c.transport],["Neprevăzute",-c.neprevazute],["Ieșiri și mici plăceri",-c.iesiri]];
  var b='<h3>RAPORT DE LUNĂ</h3><div class="sm">'+(supravietuit?"30 de zile":"oprit în ziua "+S.zi)+' · '+esc(S.loc.n.toLowerCase())+'</div><hr>'+
    '<div class="l"><span>Salariu net</span><span class="v plus">+'+lei(SALARIU)+'</span></div>'+
    (c.extra?'<div class="l"><span>Bani în plus</span><span class="v plus">+'+lei(c.extra)+'</span></div>':'');
  linii.forEach(function(x){if(x[1])b+='<div class="l"><span>'+x[0]+'</span><span class="v">'+semn(x[1])+'</span></div>'});
  b+='<hr><div class="l t"><span>RĂMAS</span><span class="v">'+lei(S.bani)+' lei</span></div>'+
     '<div class="l"><span>Energie / moral</span><span class="v">'+S.en+' / '+S.mo+'</span></div>'+
     (supravietuit?'<div class="l t"><span>SCOR</span><span class="v">'+lei(scor)+'</span></div>':'');
  $("card").innerHTML=rezHtml()+'<div class="eti">'+(supravietuit?"Ziua de salariu":"Sfârșit")+'</div><div class="final-t">'+esc(titlu)+'</div><p class="sub">'+esc(text)+
    (recordNou?" <b>Record nou.</b>":"")+'</p><button class="cta" id="iar">Joacă din nou</button><button class="cta sec" id="trimite">Trimite rezultatul</button>';
  hud(); arataRecord();
  var el=$("bon"); el.hidden=false; el.innerHTML=b;
  $("iar").addEventListener("click",function(){window.scrollTo(0,0);intro()});
  $("trimite").addEventListener("click",function(){
    var msg=(supravietuit?"Am rezistat o lună în București cu salariul minim și mi-au rămas "+lei(S.bani)+" lei.":"N-am rezistat o lună în București cu salariul minim: m-am oprit în ziua "+S.zi+".")+" Tu?";
    var url="https://draghicioiu.ro/salariu-minim/", btn=this;
    if(navigator.share){navigator.share({title:"Salariul Minim – jocul",text:msg,url:url}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(msg+" "+url).then(function(){btn.textContent="Copiat în clipboard"},function(){})}
  });
}
window.__joc={get S(){return S},intro:intro};
intro();
})();
</script>
</body>
</html>
